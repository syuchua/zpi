name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} with Zig 0.17.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            machine: x86_64
            zig_archive: zig-x86_64-linux-0.17.0.tar.xz
            zig_sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            machine: aarch64
            zig_archive: zig-aarch64-linux-0.17.0.tar.xz
            zig_sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
          - os: macos-15-intel
            platform: macos-x64
            machine: x86_64
            zig_archive: zig-x86_64-macos-0.17.0.tar.xz
            zig_sha256: 4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6
          - os: macos-15
            platform: macos-arm64
            machine: arm64
            zig_archive: zig-aarch64-macos-0.17.0.tar.xz
            zig_sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Zig
        env:
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          archive="$RUNNER_TEMP/$ZIG_ARCHIVE"
          curl -fsSL --retry 3 --max-time 180 "https://ziglang.org/download/0.17.0/$ZIG_ARCHIVE" -o "$archive"
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/zig"
          tar -xf "$archive" --strip-components=1 -C "$RUNNER_TEMP/zig"
          test "$("$RUNNER_TEMP/zig/zig" version)" = 0.17.0
          printf '%s\n' "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Provision Linux search dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep fd-find

      - name: Provision macOS search dependencies
        if: runner.os == 'macOS'
        run: |
          for tool in ripgrep fd; do
            if ! brew list --versions "$tool"; then brew install "$tool"; fi
          done

      - name: Prepare real pi SDK fixtures
        run: |
          sdk="$RUNNER_TEMP/pi-sdk"
          mkdir "$sdk"
          printf '%s\n' '{"private":true,"dependencies":{"@earendil-works/pi-coding-agent":"1.6.0"}}' > "$sdk/package.json"
          npm --prefix "$sdk" install --ignore-scripts --no-audit --no-fund
          revision=c815ddaa3736bd0b009ce6a997ee5003f8a3a532
          examples=packages/coding-agent/examples/extensions
          mkdir -p ".reference/pi/$examples"
          (
            cd ".reference/pi/$examples"
            for example in hello.ts input-transform.ts; do
              curl -fsSL --retry 3 --max-time 60 "https://raw.githubusercontent.com/earendil-works/pi/$revision/$examples/$example" -o "$example"
            done
            shasum -a 256 -c <<'CHECKSUMS'
          0aa4e9800c2526914d4c1edb00b2cfa9bd9dd6da5218289994cccd5f5bfa4934  hello.ts
          cf0f65d610631ca75d18aae1c8f1408139702f674cb2835f8c009b943776474b  input-transform.ts
          CHECKSUMS
          )
          printf 'ZPI_PI_SDK=%s\n' "$sdk/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"

      - name: Check formatting and scripts
        run: |
          zig fmt --check build.zig build.zig.zon src
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do sh -n "$script"; done
          node --check scripts/ts-host.mjs
          node --check scripts/pi-sdk.mjs
          node --check scripts/test-pi-session-parity.mjs
          node --check scripts/probe-ts-installed.mjs
          rg --version
          if command -v fd >/dev/null; then fd --version; else fdfind --version; fi

      - name: Build and run Zig suites
        run: zig build test install test-binaries --summary all

      - name: Run offline CLI, SDK and context-budget fixtures
        run: |
          if [ "$RUNNER_OS" = macOS ]; then extension=dylib; else extension=so; fi
          export ZPI_TEST_NATIVE_PLUGINS="$PWD/zig-out/lib/libzpi-native-c-fixture.$extension:$PWD/zig-out/lib/libzpi-native-zig-fixture.$extension"
          python3 scripts/test-cli.py
          python3 scripts/test-ts-host.py "$ZPI_PI_SDK"
          python3 scripts/test-context-budget.py

      - name: Build and smoke-test a local ReleaseSafe archive
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) export ZPI_RELEASE_VERSION="${GITHUB_REF#refs/tags/v}" ;;
          esac
          archive="zpi-$RELEASE_PLATFORM.tar.gz"
          sh scripts/build-release.sh "$archive" "$RUNNER_TEMP/zpi-release"
          cd "$RUNNER_TEMP/zpi-release"
          shasum -a 256 -c "$archive.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/zpi-release/zpi-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/zpi-release/zpi-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release checksums
        working-directory: release-assets
        run: |
          for platform in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            shasum -a 256 -c "zpi-$platform.tar.gz.sha256"
          done

      - name: Publish release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Zpi ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release-assets/zpi-linux-x64.tar.gz
            release-assets/zpi-linux-x64.tar.gz.sha256
            release-assets/zpi-linux-arm64.tar.gz
            release-assets/zpi-linux-arm64.tar.gz.sha256
            release-assets/zpi-macos-x64.tar.gz
            release-assets/zpi-macos-x64.tar.gz.sha256
            release-assets/zpi-macos-arm64.tar.gz
            release-assets/zpi-macos-arm64.tar.gz.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
