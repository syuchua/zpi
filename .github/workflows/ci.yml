name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_release:
        description: Existing release tag to add compatibility archives to (for example v0.1.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} with Zig 0.17.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            machine: x86_64
            zig_archive: zig-x86_64-linux-0.17.0.tar.xz
            zig_sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            machine: aarch64
            zig_archive: zig-aarch64-linux-0.17.0.tar.xz
            zig_sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
          - os: macos-15-intel
            platform: macos-x64
            machine: x86_64
            zig_archive: zig-x86_64-macos-0.17.0.tar.xz
            zig_sha256: 4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6
          - os: macos-15
            platform: macos-arm64
            machine: arm64
            zig_archive: zig-aarch64-macos-0.17.0.tar.xz
            zig_sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Zig
        env:
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          archive="$RUNNER_TEMP/$ZIG_ARCHIVE"
          if ! curl -fsSL --connect-timeout 15 --max-time 180 "https://ziglang.org/download/0.17.0/$ZIG_ARCHIVE" -o "$archive"; then
            rm -f "$archive"
            curl -fsSL --connect-timeout 15 --max-time 180 "https://pkg.hexops.org/zig/$ZIG_ARCHIVE" -o "$archive"
          fi
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/zig"
          tar -xf "$archive" --strip-components=1 -C "$RUNNER_TEMP/zig"
          test "$("$RUNNER_TEMP/zig/zig" version)" = 0.17.0
          printf '%s\n' "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Provision Linux search dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep fd-find

      - name: Provision macOS search dependencies
        if: runner.os == 'macOS'
        run: |
          for tool in ripgrep fd; do
            if ! brew list --versions "$tool"; then brew install "$tool"; fi
          done

      - name: Prepare real pi SDK fixtures
        run: |
          sdk="$RUNNER_TEMP/pi-sdk"
          mkdir "$sdk"
          printf '%s\n' '{"private":true,"dependencies":{"@earendil-works/pi-coding-agent":"1.6.0"}}' > "$sdk/package.json"
          npm --prefix "$sdk" install --ignore-scripts --no-audit --no-fund
          revision=c815ddaa3736bd0b009ce6a997ee5003f8a3a532
          examples=packages/coding-agent/examples/extensions
          mkdir -p ".reference/pi/$examples"
          (
            cd ".reference/pi/$examples"
            for example in hello.ts input-transform.ts; do
              curl -fsSL --retry 3 --max-time 60 "https://raw.githubusercontent.com/earendil-works/pi/$revision/$examples/$example" -o "$example"
            done
            shasum -a 256 -c <<'CHECKSUMS'
          0aa4e9800c2526914d4c1edb00b2cfa9bd9dd6da5218289994cccd5f5bfa4934  hello.ts
          cf0f65d610631ca75d18aae1c8f1408139702f674cb2835f8c009b943776474b  input-transform.ts
          CHECKSUMS
          )
          printf 'ZPI_PI_SDK=%s\n' "$sdk/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"

      - name: Check formatting and scripts
        run: |
          zig fmt --check build.zig build.zig.zon src
          python3 -m py_compile scripts/*.py
          for script in scripts/*.sh; do sh -n "$script"; done
          node --check scripts/ts-host.mjs
          node --check scripts/pi-sdk.mjs
          node --check scripts/test-pi-session-parity.mjs
          node --check scripts/probe-ts-installed.mjs
          sh -n install.sh
          python3 -m py_compile scripts/test-install.py
          python3 scripts/test-install.py
          rg --version
          if command -v fd >/dev/null; then fd --version; else fdfind --version; fi

      - name: Build and run Zig suites
        run: zig build test install test-binaries --summary all

      - name: Run offline CLI, SDK and context-budget fixtures
        run: |
          if [ "$RUNNER_OS" = macOS ]; then extension=dylib; else extension=so; fi
          export ZPI_TEST_NATIVE_PLUGINS="$PWD/zig-out/lib/libzpi-native-c-fixture.$extension:$PWD/zig-out/lib/libzpi-native-zig-fixture.$extension"
          python3 scripts/test-cli.py
          python3 scripts/test-rpc.py "$(pwd)/zig-out/bin/zpi"
          python3 scripts/test-trusted-execution.py "$(pwd)/zig-out/bin/zpi"
          python3 scripts/test-usability-upgrades.py "$(pwd)/zig-out/bin/zpi"
          python3 scripts/test-ts-host.py "$ZPI_PI_SDK"
          python3 scripts/test-context-budget.py

  release-init:
    name: Prepare GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch && inputs.refresh_release != '')
    needs: [native]
    concurrency:
      group: release-init-${{ inputs.refresh_release || github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or verify release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.refresh_release || github.ref_name }}
          IS_REFRESH: ${{ inputs.refresh_release != '' }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            printf 'Expected a version tag, got %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$IS_REFRESH" = false ]; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          fi
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- src include build.zig build.zig.zon LICENSE scripts/pi-sdk.mjs scripts/ts-host.mjs
          if [ "$IS_REFRESH" = true ]; then
            gh release view "$RELEASE_TAG" --json tagName --jq .tagName
          elif ! gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            flags=()
            case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$RELEASE_TAG" --verify-tag --title "Zpi $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" "${flags[@]}"
          fi

  release-build:
    name: ${{ matrix.platform }} release archive
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.refresh_release != '')
    needs: [release-init]
    concurrency:
      group: release-${{ inputs.refresh_release || github.ref_name }}-${{ matrix.platform }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64-gnu
            machine: x86_64
            zig_archive: zig-x86_64-linux-0.17.0.tar.xz
            zig_sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            zig_target: x86_64-linux-gnu.2.17
            container_image: quay.io/pypa/manylinux2014_x86_64@sha256:8a79ff36ce155d8f242dc8013d73c5e8bbe937defb15de7d7afb342c1ab537f4
            container_platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            machine: aarch64
            zig_archive: zig-aarch64-linux-0.17.0.tar.xz
            zig_sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
            zig_target: aarch64-linux-gnu.2.17
            container_image: quay.io/pypa/manylinux2014_aarch64@sha256:382236bfd11d86894d9792a6fa5286190b8dd3d075a7032284e123c288711e4f
            container_platform: linux/arm64
          - os: ubuntu-24.04
            platform: linux-x64-musl
            machine: x86_64
            zig_archive: zig-x86_64-linux-0.17.0.tar.xz
            zig_sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
            zig_target: x86_64-linux-musl
            container_image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            container_platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
            machine: aarch64
            zig_archive: zig-aarch64-linux-0.17.0.tar.xz
            zig_sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
            zig_target: aarch64-linux-musl
            container_image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            container_platform: linux/arm64
          - os: macos-15-intel
            platform: macos-x64
            machine: x86_64
            zig_archive: zig-x86_64-macos-0.17.0.tar.xz
            zig_sha256: 4f9a1c5269aa17ebda5e6d3c2b89d6cbf36f7d2b22a0306e9ab98f25f95529c6
            zig_target: x86_64-macos.10.15
            macos_min: '10.15'
          - os: macos-15
            platform: macos-arm64
            machine: arm64
            zig_archive: zig-aarch64-macos-0.17.0.tar.xz
            zig_sha256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
            zig_target: aarch64-macos.11.0
            macos_min: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Zig
        env:
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          archive="$RUNNER_TEMP/$ZIG_ARCHIVE"
          if ! curl -fsSL --connect-timeout 15 --max-time 180 "https://ziglang.org/download/0.17.0/$ZIG_ARCHIVE" -o "$archive"; then
            rm -f "$archive"
            curl -fsSL --connect-timeout 15 --max-time 180 "https://pkg.hexops.org/zig/$ZIG_ARCHIVE" -o "$archive"
          fi
          printf '%s  %s\n' "$ZIG_SHA256" "$archive" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/zig"
          tar -xf "$archive" --strip-components=1 -C "$RUNNER_TEMP/zig"
          test "$("$RUNNER_TEMP/zig/zig" version)" = 0.17.0
          printf '%s\n' "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build target archive
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ inputs.refresh_release || github.ref_name }}
          RELEASE_OUTPUT: ${{ runner.temp }}/zpi-release
          ZPI_RELEASE_TARGET: ${{ matrix.zig_target }}
          ZPI_RELEASE_CONTAINER_IMAGE: ${{ matrix.container_image }}
          ZPI_RELEASE_CONTAINER_PLATFORM: ${{ matrix.container_platform }}
          ZPI_RELEASE_MACOS_MIN: ${{ matrix.macos_min }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            printf 'Expected a version tag, got %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          git diff --exit-code "refs/tags/$RELEASE_TAG" HEAD -- src include build.zig build.zig.zon LICENSE scripts/pi-sdk.mjs scripts/ts-host.mjs
          export ZPI_RELEASE_VERSION="${RELEASE_TAG#v}"
          archive="zpi-$ZPI_RELEASE_VERSION-$RELEASE_PLATFORM.tar.gz"
          sh scripts/build-release.sh "$archive" "$RELEASE_OUTPUT"

      - name: Verify release archive
        working-directory: ${{ runner.temp }}/zpi-release
        env:
          RELEASE_TAG: ${{ inputs.refresh_release || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          archive="zpi-${RELEASE_TAG#v}-$RELEASE_PLATFORM.tar.gz"
          test "$(awk '{ print $2 }' "$archive.sha256")" = "$archive"
          shasum -a 256 -c "$archive.sha256"

      - name: Keep release archive workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/zpi-release/zpi-*.tar.gz
            ${{ runner.temp }}/zpi-release/zpi-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload release archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.refresh_release || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        working-directory: ${{ runner.temp }}/zpi-release
        run: |
          archive="zpi-${RELEASE_TAG#v}-$RELEASE_PLATFORM.tar.gz"
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber
